<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEPLOY</title>
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
<div id="app">

  <header class="header">
    <div class="brand">
      <span class="logo logo-cube" aria-hidden="true"><svg viewBox="0 0 96 96" width="42" height="42"><defs><linearGradient id="cbtop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a386ff"/><stop offset="1" stop-color="#7c6cf6"/></linearGradient><linearGradient id="cbleft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b8def"/><stop offset="1" stop-color="#3d6fd1"/></linearGradient><linearGradient id="cbright" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#46539b"/><stop offset="1" stop-color="#2f3778"/></linearGradient></defs><path d="M48 10 L80 28 L48 46 L16 28 Z" fill="url(#cbtop)"/><path d="M16 28 L48 46 L48 82 L16 64 Z" fill="url(#cbleft)"/><path d="M80 28 L48 46 L48 82 L80 64 Z" fill="url(#cbright)"/><path d="M42 54 L42 70 L57 62 Z" fill="#ffffff" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/></svg></span>
      <div>
        <h1>DEPLOY</h1>
        <p>Run any repo. Zero downloads.</p>
      </div>
    </div>
    <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.89a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.09A1.7 1.7 0 0 0 10.11 3V3a2 2 0 1 1 4 0v.09c0 .68.4 1.3 1.01 1.56a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.09c.26.61.88 1.01 1.56 1.01H21a2 2 0 1 1 0 4h-.09c-.68 0-1.3.4-1.51 1.01z"/></svg></button>
  </header>

  <section class="loader">
    <div class="row">
      <input id="repoUrl" type="text" placeholder="github.com/owner/repo  or  owner/repo"
             spellcheck="false" autocomplete="off">
      <button id="loadBtn" class="primary">Load</button>
    </div>
    <div id="statusLine" class="status" role="status"></div>
  </section>

  <nav class="tabs">
    <button id="tabFiles" class="tab active">Files</button>
    <button id="tabReadme" class="tab">README</button>
  </nav>

  <main id="content">
    <section id="panelFiles" class="panel active">
      <div id="repoMeta" class="meta hidden"></div>
      <div id="fileTree" class="tree"><p class="empty">Load a repo to browse its files.</p></div>
      <div id="fileView" class="fileview hidden">
        <div class="fileview-head">
          <span id="fileViewName"></span>
          <button id="fileViewClose" class="icon-btn" title="Close">&#10005;</button>
        </div>
        <pre id="fileViewContent"></pre>
      </div>
    </section>
    <section id="panelReadme" class="panel">
      <pre id="readmeContent" class="readme">Load a repo to read its README.</pre>
    </section>
  </main>

  <section class="runbar">
    <div class="runbtns">
      <button id="runBtn" class="run" disabled><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13c0 .8.9 1.3 1.6.9l10-6.5c.6-.4.6-1.4 0-1.8l-10-6.5c-.7-.4-1.6.1-1.6.9z"/></svg><span>Run repo</span></button>
      <button id="previewRunBtn" class="run preview-run" disabled><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg><span>Run + Preview</span></button>
    </div>
    <button id="previewBtn" class="preview hidden"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg><span>Preview kholo</span></button>
    <pre id="runOutput" class="runout hidden"></pre>
  </section>

  <section class="chat">
    <div class="chat-head">Ask AI about this repo</div>
    <div id="chatMessages" class="messages"></div>
    <div class="chat-input row">
      <input id="chatInput" type="text" placeholder="Ask about the repo&hellip;" autocomplete="off">
      <button id="sendBtn" class="primary">Send</button>
    </div>
  </section>

  <footer class="foot">Powered by <strong>Aetros-Biz</strong></footer>

</div>
<script src="env.js"></script>
<script src="github.js"></script>
<script src="chat.js"></script>
<script src="runner.js"></script>
<script src="sidepanel.js"></script>
</body>
</html>
