<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deploy Settings</title>
<style>
  :root {
    --bg: #0e1014; --panel: #141824; --border: #262d3d;
    --text: #e8ebf3; --muted: #98a1b3; --accent: #7c6cf6;
    --accent-hover: #6a59e8; --danger: #f26d6d; --ok: #4ade80;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex; justify-content: center; padding: 32px 16px;
  }
  .card {
    width: 100%; max-width: 480px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 14px; padding: 24px;
  }
  h1 { margin: 0 0 4px; font-size: 20px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
  input[type="text"], input[type="password"], select {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text);
    padding: 10px 12px; font-size: 14px; outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .btnrow { display: flex; gap: 10px; margin-top: 20px; }
  button {
    flex: 1; border: none; border-radius: var(--radius);
    padding: 11px; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  #saveBtn { background: var(--accent); color: #fff; }
  #saveBtn:hover { background: var(--accent-hover); }
  #testBtn { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  #testBtn:hover:not(:disabled) { border-color: var(--accent); }
  #testBtn:disabled { opacity: 0.55; cursor: default; }
  .status { min-height: 20px; margin-top: 12px; font-size: 13px; color: var(--muted); }
  .status.ok { color: var(--ok); }
  .status.error { color: var(--danger); }
</style>
</head>
<body>
<div class="card">
  <h1>Deploy Settings</h1>
  <p class="sub">Your API key is stored only in this browser (chrome.storage.local) and is sent only to your chosen AI provider.</p>

  <label for="provider">AI provider</label>
  <select id="provider">
    <option value="openai">OpenAI</option>
    <option value="claude">Claude (Anthropic)</option>
  </select>

  <label for="apiKey">API key</label>
  <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off" spellcheck="false">
  <div class="hint">Never shared anywhere except the provider's API.</div>

  <label for="model">Model (optional)</label>
  <input id="model" type="text" placeholder="e.g. gpt-4o-mini" autocomplete="off" spellcheck="false">
  <div class="hint">Leave empty to use the default for the selected provider.</div>

  <div class="btnrow">
    <button id="saveBtn">Save</button>
    <button id="testBtn">Test connection</button>
  </div>
  <div id="status" class="status" role="status"></div>
</div>
<script src="env.js"></script>
<script src="options.js"></script>
</body>
</html>
